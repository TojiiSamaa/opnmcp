name: ci-rust

on:
  push:
    branches: [rust-port, main]
    tags: ["v*"]
  pull_request:
    paths: ["rust/**", ".github/workflows/ci-rust.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: rust

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    name: build ${{ matrix.target }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          name="osmcp-${{ matrix.target }}"
          mkdir "$name"
          cp "target/release/osmcp${{ matrix.ext }}" "$name/"
          cp ../LICENSE ../README.md "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: osmcp-${{ matrix.target }}
          path: |
            rust/osmcp-*.tar.gz
            rust/osmcp-*.zip

  # Hors release : l'image est construite (pas publiée) pour que Dockerfile ne casse jamais sans qu'on le voie.
  image-check:
    name: image (test de construction)
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ${{ vars.IMAGE_RUNNER_AMD64 || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: rust
          push: false

  # Sur un tag : une image par architecture, construite sur une machine de cette architecture
  # (compiler du Rust sous émulation prendrait plus d'une demi-heure), puis un manifeste commun.
  # Le runner amd64 se choisit par la variable de dépôt IMAGE_RUNNER_AMD64 (ex. fyh) ; sans elle, runner GitHub.
  image:
    name: image ${{ matrix.platform }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, arch: amd64, runner: "${{ vars.IMAGE_RUNNER_AMD64 || 'ubuntu-latest' }}" }
          - { platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/tojiisamaa/opnmcp
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: rust
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Garder le condensat
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

  image-manifest:
    name: image (manifeste et étiquettes)
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/tojiisamaa/opnmcp
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Créer le manifeste multi-architecture
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: Vérifier
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"

  release:
    name: publier la release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, image-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: osmcp-*
          merge-multiple: true
      - run: sha256sum dist/* > dist/SHA256SUMS
      - name: Note de release
        run: |
          {
            echo "## Image Docker"
            echo
            echo '```'
            echo "docker pull ghcr.io/tojiisamaa/opnmcp:${GITHUB_REF_NAME#v}"
            echo '```'
            echo
            echo "Architectures : linux/amd64 et linux/arm64. Binaire statique dans une image vide, sans shell."
            echo
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          generate_release_notes: true
